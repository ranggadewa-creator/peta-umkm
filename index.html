<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Peta Persebaran UMKM Desa Tobelo</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

#judul{
    background:#0b5ed7;
    color:white;
    padding:12px;
    font-size:22px;
    font-weight:bold;
}

#map{
    width:100%;
    height:92vh;
}

.legend{
    background:white;
    padding:10px;
    border-radius:8px;
    line-height:25px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.legend span{
    font-size:18px;
}

img.popup{
    width:250px;
    border-radius:8px;
    margin-bottom:8px;
}

</style>

</head>

<body>

<div id="judul">
PETA PERSEBARAN UMKM DESA TOBELO
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

//=========================
// BASEMAP
//=========================

var osm=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:20,
attribution:'© OpenStreetMap'
});

var esri=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
attribution:'Tiles © Esri'
});

//=========================
// MAP
//=========================

var map=L.map('map',{
center:[-7.775,110.387],
zoom:15,
layers:[osm]
});

//=========================
// ICON
//=========================

var iconKuliner=L.icon({

iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',

shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',

iconSize:[25,41],
iconAnchor:[12,41]

});

//=========================
// LAYER UMKM
//=========================

var kuliner=L.layerGroup();

L.marker([-7.775,-110.387],{
icon:iconKuliner
})

.bindPopup(`

<img class="popup" src="images/kopi_nako.jpg">

<h2>Kopi Nako</h2>

<b>Kategori :</b> Coffee & Beverages<br>

<b>Alamat :</b><br>
Jl. Contoh No.1<br><br>

<b>Deskripsi :</b><br>
Menyediakan berbagai minuman kopi dan non kopi.<br><br>

<a target="_blank"
href="https://maps.google.com/?q=-7.775,110.387">
Buka di Google Maps
</a>

`)

.addTo(kuliner);

kuliner.addTo(map);

//=========================
// LAYER CONTROL
//=========================

var baseMaps={

"OpenStreetMap":osm,

"Satelit":esri

};

var overlayMaps={

"UMKM Kuliner":kuliner

};

L.control.layers(baseMaps,overlayMaps).addTo(map);

//=========================
// LEGENDA
//=========================

var legend=L.control({
position:'bottomright'
});

legend.onAdd=function(){

var div=L.DomUtil.create('div','legend');

div.innerHTML=`

<b>Legenda</b><br><br>

<span style="color:red;">📍</span> UMKM Kuliner

`;

return div;

};

legend.addTo(map);

</script>

</body>
</html>
