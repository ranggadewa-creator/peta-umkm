<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Peta UMKM Desa Tobelo</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
}

h2{
margin:10px;
}

#map{
height:90vh;
}

</style>

</head>

<body>

<h2>Peta Persebaran UMKM Desa Tobelo</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([-7.775,110.387],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

L.marker([-7.775,110.387]).addTo(map)
.bindPopup("<b>Contoh UMKM</b><br>Kopi Nako");

</script>

</body>
</html>
